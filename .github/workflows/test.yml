name: SAM Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install R (for rpy2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile agents/*.py app.py

      - name: Run E2E tests
        run: python -m pytest tests/test_e2e_pipeline.py -v

      - name: Run Groq adapter tests
        run: python -m pytest tests/test_groq_adapter.py -v
