name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base-core
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Install CI requirements if available, else requirements.txt
          if [ -f requirements-ci.txt ]; then
            pip install -r requirements-ci.txt
          else
            pip install -r requirements.txt
          fi
      - name: Lint (syntax check)
        run: |
          python -m py_compile agents/*.py api.py
      - name: Run tests
        env:
          ENTREZ_EMAIL: ci@example.com
          UNPAYWALL_EMAIL: ci@example.com
        run: |
          python -m pytest tests/ -q --ignore=tests/test_local_nutrition.py
